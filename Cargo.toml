# The root crate is NOT published — the public Rust SDK is `logisheets-rs`
# (crates/api). This package exists only to host the workspace and the
# integration test suite in `tests/` (which `use logisheets::…`), so it keeps a
# minimal `src/lib.rs` re-export. `publish = false` guards against an accidental
# `cargo publish` from the repo root.
[package]
name = "logisheets"
version.workspace = true
description = "A web-based spreadsheet application written in Rust and TypeScript"
license.workspace = true
publish = false
edition.workspace = true

[workspace]
members = [
    "crates/api",
    "crates/buildtools",
    "crates/controller",
    "crates/controller/ast_checker",
    "crates/controller/base",
    "crates/controller/lexer",
    "crates/controller/lexer4fmt",
    "crates/controller/parser",
    "crates/logiscript",
    "crates/sequencer",
    "crates/ssf-rs",
    "crates/wasms/server",
    "crates/workbook",
    "crates/xmldiff",
]
# Crates kept OUT of the default workspace so `cargo build/test --workspace`
# stays portable on stable/headless CI:
#   - fuzz: needs a nightly-only toolchain (libfuzzer-sys).
#   - packages/desktop/src-tauri: a Tauri GUI app whose deps (wry) require
#     platform GUI system libs (glib/gtk/webkit2gtk) that Linux CI lacks. It is
#     its own standalone workspace; build it with `cargo tauri dev/build`.
exclude = ["fuzz", "packages/desktop/src-tauri"]

[workspace.package]
version = "1.12.1"
authors = ["JeremyHe <yiliang.he@qq.com>"]
license = "MIT"
edition = "2024"

[workspace.dependencies]
chrono = "0.4"
futures = "0.3"
gents = "1.3"
gents_derives = "1.3"
getrandom = "0.2"
imbl = "7.0"
lazy_static = "1.4"
pest = "2.7"
pest_derive = "2.5"
quick-xml = "0.31"
regex = "1"
serde = "1"
serde_json = "1"
thiserror = "1.0"
xmlserde = "0.14.0"
xmlserde_derives = "0.14.0"
wildescape = "0.1"

ssf-rs = { path = "crates/ssf-rs", version = "0.1" }

logisheets_lexer = { path = "crates/controller/lexer", version = "1.12.1" }
logisheets_parser = { path = "crates/controller/parser", version = "1.12.1" }
logisheets_base = { path = "crates/controller/base", version = "1.12.1" }
logisheets_controller = { path = "crates/controller", version = "1.12.1" }
logisheets_lexer4fmt = { path = "crates/controller/lexer4fmt", version = "1.12.1" }
logisheets_astchecker = { path = "crates/controller/ast_checker", version = "1.12.1" }

logisheets_workbook_derives = { path = "crates/workbook/derives", version = "1.12.1" }
xmldiff = { path = "crates/xmldiff", version = "1.9.0" }
logisheets_workbook = { path = "crates/workbook", version = "1.12.1" }
logisheets-rs = { path = "crates/api", version = "1.12.1" }

[dependencies]
logisheets_controller = { workspace = true }
logisheets_workbook = { workspace = true }

[dev-dependencies]
glob = "0.3.1"
# Round-trip tests reach into the saved .xlsx to check a part is really there;
# the only way to see what another spreadsheet would see.
zip = { version = "0.6.0", default-features = false, features = ["deflate"] }
logiscript = { path = "crates/logiscript" }
logisheets_base = { workspace = true }
proptest = "1"

# Cargo ignores `[profile.*]` in non-root workspace members, so the wasm crate's
# own request for a size-optimized build was silently dropped (it only produced a
# warning). Declaring it here as a per-package override is the form that applies.
# Scoped to the wasm crate on purpose: the native crates keep the default
# opt-level, since trading their speed for size buys nothing.
[profile.release.package.logisheets_wasm_server]
opt-level = "s"

