<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>关灯</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f5f7; color: #111827; font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,0.06);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stat { font-size: 14px; font-weight: 700; }
    .muted { color: #6b7280; font-size: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; font-size: 14px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #111827; cursor: pointer;
    }
    .btn:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .link { background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    select { padding: 6px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; }
    .moves { font-size: 22px; font-weight: 800; }
    .win { color: #15803d; font-weight: 800; font-size: 16px; }
    .hint { color: #6b7280; font-size: 11px; line-height: 1.6; }
    .hidden { display: none !important; }
    label.field { display: inline-flex; align-items: center; gap: 6px; color: #4b5563; }
  </style>
</head>
<body>
  <h1>关灯</h1>
  <div class="subtitle">Lights Out — 点一格会翻转它和上下左右的灯，把所有灯关掉就赢</div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <span class="stat">步数 <span id="moves" class="moves">0</span></span>
      <span class="muted">已解决 <b id="solved">0</b> 局 · 最少 <b id="best">—</b> 步</span>
    </div>
    <div id="win" class="win hidden">🎉 全部关灯！</div>
  </div>

  <div class="card">
    <div class="row">
      <label class="field">难度
        <select id="difficulty">
          <option value="easy">简单</option>
          <option value="medium" selected>中等</option>
          <option value="hard">困难</option>
        </select>
      </label>
      <button id="new-btn" class="btn btn-primary" type="button">新游戏</button>
      <button id="replay-btn" class="btn" type="button">重玩本局</button>
    </div>
    <div class="row" style="margin-top: 8px;">
      <button id="reset-btn" class="link" type="button">重置进度</button>
    </div>
  </div>

  <div class="card">
    <div class="hint">
      在右侧「关灯」表上点格子：被点的格子和它<b>上下左右</b>的灯会一起翻转（亮↔灭）。<br/>
      目标是把整块 5×5 <b>全部熄灭</b>。换难度或点「新游戏」会重新出题；进度自动保存。
    </div>
  </div>

  <script src="./lights-out.js"></script>
  <script>
    var LO = window.LightsOut
    var wb = null
    var boardSheetIdx = null
    var progress = null
    var board = null       // current Board (0/1 array)
    var startBoard = null  // this puzzle's initial state, for 重玩本局
    var moves = 0
    var solved = false
    var busy = false

    function notify(level, msg) {
      try { if (window.notifyCraft) window.notifyCraft(level, msg) } catch (e) {}
      if (level === 'error') console.error('[lights-out]', msg)
    }
    function show(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible) }

    function loadProgress() {
      progress = LO.parseProgress(window.getCraftState ? window.getCraftState() : undefined)
    }
    function saveProgress() {
      if (window.setCraftState) window.setCraftState(LO.serializeProgress(progress))
    }

    function renderHeader() {
      document.getElementById('moves').textContent = moves
      document.getElementById('solved').textContent = progress.solved
      document.getElementById('best').textContent = progress.best == null ? '—' : progress.best
      document.getElementById('difficulty').value = progress.difficulty
    }

    // ---- interaction ------------------------------------------------
    async function onCellClick(r, c) {
      if (busy || solved) return
      busy = true
      try {
        LO.applyMove(board, r, c)
        moves++
        await LO.renderBoard(wb, boardSheetIdx, board)
        if (LO.isSolved(board)) {
          solved = true
          progress.solved += 1
          progress.best = progress.best == null ? moves : Math.min(progress.best, moves)
          progress.board = null
          progress.moves = 0
          saveProgress()
          show('win', true)
        } else {
          progress.board = board.slice()
          progress.moves = moves
          saveProgress()
        }
        renderHeader()
      } catch (e) {
        notify('error', e)
      } finally {
        busy = false
      }
    }

    function canvasHandler(e) {
      if (boardSheetIdx === null || e.sheetIdx !== boardSheetIdx) return false
      switch (e.type) {
        case 'contextmenu':
          return true
        case 'mousedown':
          if (e.button === 0 && !solved && e.row != null && e.col != null &&
              e.row < LO.SIZE && e.col < LO.SIZE)
            onCellClick(e.row, e.col)
          // Always consume on the board: blocks selection + double-click-to-edit.
          return true
        case 'click':
        case 'dblclick':
        case 'mouseup':
          return true
      }
      return false
    }

    // ---- game control ----------------------------------------------
    async function newGame(diff) {
      if (busy) return
      busy = true
      try {
        solved = false
        progress.difficulty = diff
        board = LO.generatePuzzle(LO.DIFFICULTY[diff])
        startBoard = board.slice()
        moves = 0
        progress.board = board.slice()
        progress.moves = 0
        saveProgress()
        show('win', false)
        await LO.renderBoard(wb, boardSheetIdx, board)
        renderHeader()
      } finally {
        busy = false
      }
    }

    async function replay() {
      if (busy) return
      if (!startBoard) { newGame(progress.difficulty); return }
      busy = true
      try {
        solved = false
        board = startBoard.slice()
        moves = 0
        progress.board = board.slice()
        progress.moves = 0
        saveProgress()
        show('win', false)
        await LO.renderBoard(wb, boardSheetIdx, board)
        renderHeader()
      } finally {
        busy = false
      }
    }

    function resetProgress() {
      var diff = progress.difficulty
      progress = {solved: 0, best: null, difficulty: diff, board: null, moves: 0}
      saveProgress()
      newGame(diff)
    }

    // ---- boot -------------------------------------------------------
    function whenHostReady(cb) {
      var tries = 0
      ;(function loop() {
        if (typeof window.onCanvasInput === 'function' && window.workbook) { cb(); return }
        if (tries++ > 600) { console.warn('[lights-out] host APIs not injected'); return }
        setTimeout(loop, 50)
      })()
    }

    function init() {
      LO = window.LightsOut
      document.getElementById('difficulty').addEventListener('change', function (e) {
        newGame(e.target.value)
      })
      document.getElementById('new-btn').addEventListener('click', function () {
        newGame(document.getElementById('difficulty').value)
      })
      document.getElementById('replay-btn').addEventListener('click', replay)
      document.getElementById('reset-btn').addEventListener('click', resetProgress)

      whenHostReady(async function () {
        wb = window.workbook
        window.onCanvasInput(canvasHandler)
        if (window.setSelectionSuppressed) window.setSelectionSuppressed(true)
        loadProgress()
        try {
          boardSheetIdx = await LO.ensureBoard(wb)
          if (window.setSelection) window.setSelection(boardSheetIdx, 0, 0)
          if (progress.board && !LO.isSolved(progress.board)) {
            board = progress.board.slice()
            moves = progress.moves
            solved = false
            startBoard = null
            await LO.renderBoard(wb, boardSheetIdx, board)
            renderHeader()
          } else {
            await newGame(progress.difficulty)
          }
        } catch (e) {
          notify('error', '初始化失败：' + (e && e.message || e))
        }
      })
    }

    window.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
