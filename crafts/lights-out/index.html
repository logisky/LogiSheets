<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title">关灯</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f5f7; color: #111827; font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,0.06);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stat { font-size: 14px; font-weight: 700; }
    .muted { color: #6b7280; font-size: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; font-size: 14px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #111827; cursor: pointer;
    }
    .btn:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .link { background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    select { padding: 6px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; }
    .moves { font-size: 22px; font-weight: 800; }
    .win { color: #15803d; font-weight: 800; font-size: 16px; }
    .hint { color: #6b7280; font-size: 11px; line-height: 1.6; }
    .hidden { display: none !important; }
    label.field { display: inline-flex; align-items: center; gap: 6px; color: #4b5563; }
  </style>
</head>
<body>
  <h1 data-i18n="title">关灯</h1>
  <div class="subtitle" data-i18n="subtitle">Lights Out — 点一格会翻转它和上下左右的灯，把所有灯关掉就赢</div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <span class="stat"><span data-i18n="moves">步数</span> <span id="moves" class="moves">0</span></span>
      <span class="muted"><span data-i18n="solvedPre">已解决</span> <b id="solved">0</b> <span data-i18n="solvedPost">局 · 最少</span> <b id="best">—</b> <span data-i18n="movesUnit">步</span></span>
    </div>
    <div id="win" class="win hidden" data-i18n="win">🎉 全部关灯！</div>
  </div>

  <div class="card">
    <div class="row">
      <label class="field"><span data-i18n="difficulty">难度</span>
        <select id="difficulty">
          <option value="easy" data-i18n="easy">简单</option>
          <option value="medium" selected data-i18n="medium">中等</option>
          <option value="hard" data-i18n="hard">困难</option>
        </select>
      </label>
      <button id="new-btn" class="btn btn-primary" type="button" data-i18n="newGame">新游戏</button>
      <button id="replay-btn" class="btn" type="button" data-i18n="replay">重玩本局</button>
    </div>
    <div class="row" style="margin-top: 8px;">
      <button id="reset-btn" class="link" type="button" data-i18n="resetProgress">重置进度</button>
    </div>
  </div>

  <div class="card">
    <div class="hint" data-i18n-html="hint">
      在右侧「关灯」表上点格子：被点的格子和它<b>上下左右</b>的灯会一起翻转（亮↔灭）。<br/>
      目标是把整块 5×5 <b>全部熄灭</b>。换难度或点「新游戏」会重新出题；进度自动保存。
    </div>
  </div>

  <script src="./lights-out.js"></script>
  <script>
    var LO = window.LightsOut

    // ---- language ----------------------------------------------------
    //
    // The host tells a craft which language it is speaking (`window.locale`,
    // a BCP-47 tag) and offers to say so again when the user switches
    // (`window.onLocaleChange`). Both are optional: opened standalone, or in
    // an older host, neither exists and the craft simply stays in its default
    // language — which is why `pickLocale` falls back rather than throwing.
    //
    // The board's SHEET NAME follows the language too (the tab is something
    // the player reads). It is also how the craft finds its board again, so
    // lookups go through LO.findBoardSheet, which knows every name we ship —
    // a game started in Chinese is still found after a switch to English, and
    // the sheet is renamed rather than duplicated.
    var STRINGS = {
      'zh-CN': {
        title: '关灯',
        subtitle: 'Lights Out — 点一格会翻转它和上下左右的灯，把所有灯关掉就赢',
        moves: '步数',
        solvedPre: '已解决',
        solvedPost: '局 · 最少',
        movesUnit: '步',
        win: '🎉 全部关灯！',
        difficulty: '难度',
        easy: '简单',
        medium: '中等',
        hard: '困难',
        newGame: '新游戏',
        replay: '重玩本局',
        resetProgress: '重置进度',
        hint: '在右侧「关灯」表上点格子：被点的格子和它<b>上下左右</b>的灯会一起翻转（亮↔灭）。<br/>目标是把整块 5×5 <b>全部熄灭</b>。换难度或点「新游戏」会重新出题；进度自动保存。',
        initFailed: '初始化失败：'
      },
      en: {
        title: 'Lights Out',
        subtitle: 'Clicking a cell flips it and its four neighbours — turn every light off to win',
        moves: 'Moves',
        solvedPre: 'Solved',
        solvedPost: 'so far · best',
        movesUnit: 'moves',
        win: '🎉 All lights out!',
        difficulty: 'Difficulty',
        easy: 'Easy',
        medium: 'Medium',
        hard: 'Hard',
        newGame: 'New game',
        replay: 'Replay this one',
        resetProgress: 'Reset progress',
        hint: 'Click a cell on the board sheet: that cell and the ones <b>above, below, left and right</b> of it all flip (on ↔ off).<br/>The goal is the whole 5×5 <b>dark</b>. Changing difficulty or pressing “New game” deals a new puzzle; progress saves itself.',
        initFailed: 'Could not start: '
      }
    }
    // NOT `locale`: a top-level `var locale` IS `window.locale`, the
    // property the host injects — same binding, so each would silently
    // overwrite the other.
    var craftLocale = 'zh-CN'

    /** Nearest language we actually have, for whatever the host reports. */
    function pickLocale(tag) {
      if (!tag) return 'zh-CN'
      if (STRINGS[tag]) return tag
      var base = String(tag).replace('_', '-').split('-')[0].toLowerCase()
      if (base === 'zh') return 'zh-CN'
      if (base === 'en') return 'en'
      return 'zh-CN'
    }

    function T(key) {
      var d = STRINGS[craftLocale] || STRINGS['zh-CN']
      return d[key] != null ? d[key] : key
    }

    function applyLocale(tag) {
      craftLocale = pickLocale(tag)
      document.documentElement.lang = craftLocale
      var els = document.querySelectorAll('[data-i18n]')
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = T(els[i].getAttribute('data-i18n'))
      }
      var html = document.querySelectorAll('[data-i18n-html]')
      for (var j = 0; j < html.length; j++) {
        html[j].innerHTML = T(html[j].getAttribute('data-i18n-html'))
      }
      // The board's tab is part of the UI too, so a language switch renames
      // the sheet. Nothing to do before the host has injected a workbook, and
      // a failed rename just leaves the old name — never break the page over a
      // tab label.
      if (wb && LO) {
        LO.renameBoardToLocale(wb, craftLocale).catch(function () {})
      }
    }
    var wb = null
    var boardSheetIdx = null
    var progress = null
    var board = null       // current Board (0/1 array)
    var startBoard = null  // this puzzle's initial state, for the replay button
    var moves = 0
    var solved = false
    var busy = false

    function notify(level, msg) {
      try { if (window.notifyCraft) window.notifyCraft(level, msg) } catch (e) {}
      if (level === 'error') console.error('[lights-out]', msg)
    }
    function show(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible) }

    function loadProgress() {
      progress = LO.parseProgress(window.getCraftState ? window.getCraftState() : undefined)
    }
    function saveProgress() {
      if (window.setCraftState) window.setCraftState(LO.serializeProgress(progress))
    }

    function renderHeader() {
      document.getElementById('moves').textContent = moves
      document.getElementById('solved').textContent = progress.solved
      document.getElementById('best').textContent = progress.best == null ? '—' : progress.best
      document.getElementById('difficulty').value = progress.difficulty
    }

    // ---- interaction ------------------------------------------------
    async function onCellClick(r, c) {
      if (busy || solved) return
      busy = true
      try {
        LO.applyMove(board, r, c)
        moves++
        await LO.renderBoard(wb, boardSheetIdx, board)
        if (LO.isSolved(board)) {
          solved = true
          progress.solved += 1
          progress.best = progress.best == null ? moves : Math.min(progress.best, moves)
          progress.moves = 0
          saveProgress()
          show('win', true)
        } else {
          // The board lives in the workbook (the fills we just rendered); only
          // the move counter is craft-private, so that's all we persist.
          progress.moves = moves
          saveProgress()
        }
        renderHeader()
      } catch (e) {
        notify('error', e)
      } finally {
        busy = false
      }
    }

    function canvasHandler(e) {
      if (boardSheetIdx === null || e.sheetIdx !== boardSheetIdx) return false
      switch (e.type) {
        case 'contextmenu':
          return true
        case 'mousedown':
          if (e.button === 0 && !solved && e.row != null && e.col != null &&
              e.row < LO.SIZE && e.col < LO.SIZE)
            onCellClick(e.row, e.col)
          // Always consume on the board: blocks selection + double-click-to-edit.
          return true
        case 'click':
        case 'dblclick':
        case 'mouseup':
          return true
      }
      return false
    }

    // ---- game control ----------------------------------------------
    async function newGame(diff) {
      if (busy) return
      busy = true
      try {
        solved = false
        progress.difficulty = diff
        board = LO.generatePuzzle(LO.DIFFICULTY[diff])
        startBoard = board.slice()
        moves = 0
        progress.moves = 0
        saveProgress()
        show('win', false)
        await LO.renderBoard(wb, boardSheetIdx, board)
        renderHeader()
      } finally {
        busy = false
      }
    }

    async function replay() {
      if (busy) return
      if (!startBoard) { newGame(progress.difficulty); return }
      busy = true
      try {
        solved = false
        board = startBoard.slice()
        moves = 0
        progress.moves = 0
        saveProgress()
        show('win', false)
        await LO.renderBoard(wb, boardSheetIdx, board)
        renderHeader()
      } finally {
        busy = false
      }
    }

    function resetProgress() {
      var diff = progress.difficulty
      progress = {solved: 0, best: null, difficulty: diff, moves: 0}
      saveProgress()
      newGame(diff)
    }

    // ---- boot -------------------------------------------------------
    function whenHostReady(cb) {
      var tries = 0
      ;(function loop() {
        if (typeof window.onCanvasInput === 'function' && window.workbook) { cb(); return }
        if (tries++ > 600) { console.warn('[lights-out] host APIs not injected'); return }
        setTimeout(loop, 50)
      })()
    }

    function init() {
      LO = window.LightsOut

      // The page's own language, for the moment before the host has
      // injected anything (and forever, when opened standalone).
      applyLocale(window.locale)
      document.getElementById('difficulty').addEventListener('change', function (e) {
        newGame(e.target.value)
      })
      document.getElementById('new-btn').addEventListener('click', function () {
        newGame(document.getElementById('difficulty').value)
      })
      document.getElementById('replay-btn').addEventListener('click', replay)
      document.getElementById('reset-btn').addEventListener('click', resetProgress)

      whenHostReady(async function () {
        wb = window.workbook
        // Now that the host has injected, take its language and keep
        // following it. This has to be in here, not in `init`: the iframe's
        // DOMContentLoaded fires before the parent's `onload` injection, so
        // at init time `window.locale` is still undefined.
        applyLocale(window.locale)
        if (typeof window.onLocaleChange === 'function') {
          window.onLocaleChange(applyLocale)
        }
        window.onCanvasInput(canvasHandler)
        if (window.setSelectionSuppressed) window.setSelectionSuppressed(true)
        loadProgress()
        try {
          boardSheetIdx = await LO.ensureBoard(wb, craftLocale)
          if (window.setSelection) window.setSelection(boardSheetIdx, 0, 0)
          // The board is reconstructed from the sheet fills (the persisted truth,
          // possibly changed by Watson's solve tool while we were closed), not
          // from craftState. An all-off board means there's no game in progress.
          board = await LO.readBoard(wb, boardSheetIdx)
          if (!LO.isSolved(board)) {
            moves = progress.moves
            solved = false
            startBoard = null
            renderHeader()
          } else {
            await newGame(progress.difficulty)
          }
        } catch (e) {
          notify('error', T('initFailed') + (e && e.message || e))
        }
      })
    }

    window.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
