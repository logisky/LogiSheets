<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title">电子拼豆</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background-color: #f5f5f7;
      color: #111827;
      font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .section-title { font-weight: 600; font-size: 13px; color: #374151; margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    label.field { display: inline-flex; align-items: center; gap: 4px; color: #4b5563; }
    label.field input {
      width: 52px; padding: 3px 6px; font-size: 12px;
      border: 1px solid #d1d5db; border-radius: 4px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 14px; font-size: 13px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #111827; cursor: pointer;
    }
    .btn:hover { background: #e5e7eb; }
    .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    /* Current brushes */
    .brushes { display: flex; gap: 10px; }
    .brush {
      flex: 1; display: flex; align-items: center; gap: 8px;
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; background: #fafafa;
    }
    .brush .key { font-weight: 700; font-size: 12px; color: #6b7280; }
    .brush .swatch-lg {
      width: 34px; height: 34px; border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.18); background-image:
        linear-gradient(45deg,#eee 25%,transparent 25%),
        linear-gradient(-45deg,#eee 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eee 75%),
        linear-gradient(-45deg,transparent 75%,#eee 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
    }
    .brush .meta { font-size: 12px; line-height: 1.3; }
    .brush .meta .name { font-weight: 600; }
    .brush .meta .code { color: #6b7280; }

    /* Swatch grids */
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      position: relative; width: 26px; height: 26px; border-radius: 5px;
      border: 1px solid rgba(0,0,0,0.18); cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .swatch:hover { outline: 2px solid #2563eb; outline-offset: 1px; }
    .swatch .code {
      font-size: 8px; color: rgba(0,0,0,0.55); background: rgba(255,255,255,0.7);
      border-radius: 2px; padding: 0 1px; line-height: 1.1; pointer-events: none;
    }
    .swatch.picked::after {
      content: "✓"; position: absolute; top: -6px; right: -6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #2563eb; color: #fff; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    /* Palette category tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .tab {
      padding: 3px 9px; font-size: 12px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #374151; cursor: pointer;
      line-height: 1.4;
    }
    .tab:hover { background: #eef2f7; }
    .tab.active { border-color: #2563eb; background: #2563eb; color: #fff; }
    .tab .count { opacity: 0.6; font-size: 10px; margin-left: 3px; }
    .tab.active .count { opacity: 0.8; }
    /* Height-capped grid so the panel never grows with the color count */
    .palette-body {
      max-height: 168px; overflow-y: auto; padding: 2px;
      border: 1px solid #eef0f3; border-radius: 6px; background: #fcfcfd;
    }
    .palette-body .swatches { gap: 5px; }
    .palette-body .swatch { width: 24px; height: 24px; }

    /* Workspace chips */
    .ws { display: flex; flex-wrap: wrap; gap: 8px; }
    .ws-item { position: relative; }
    .ws-item .swatch { width: 30px; height: 30px; }
    .ws-item .rm {
      position: absolute; top: -6px; right: -6px; width: 15px; height: 15px;
      border-radius: 50%; border: none; background: #ef4444; color: #fff;
      font-size: 10px; line-height: 1; cursor: pointer; display: none;
    }
    .ws-item:hover .rm { display: block; }
    .ws-empty { color: #9ca3af; font-size: 12px; }
    .hint { color: #6b7280; font-size: 11px; margin-top: 6px; line-height: 1.5; }
    .confirm-bar {
      margin-top: 10px; padding: 8px 10px; border-radius: 6px;
      border: 1px solid #fdba74; background: #fff7ed;
    }
    .confirm-msg { font-size: 12px; color: #7c2d12; margin-bottom: 8px; }
    .confirm-actions { display: flex; gap: 8px; }
    .eraser-face {
      background: repeating-linear-gradient(45deg,#fff,#fff 4px,#f0f0f0 4px,#f0f0f0 8px) !important;
    }
  </style>
</head>
<body>
  <h1 data-i18n="title">电子拼豆</h1>
  <div class="subtitle" data-i18n="subtitle">Fuse Beads · MARD 色板 — 在表格上一格一格拼出你的像素图</div>

  <div class="card">
    <div class="row">
      <label class="field"><span data-i18n="rows">行</span> <input id="rows-input" type="number" min="1" value="120" /></label>
      <label class="field"><span data-i18n="cols">列</span> <input id="cols-input" type="number" min="1" value="120" /></label>
      <label class="field"><span data-i18n="cellSide">格边(px)</span> <input id="side-input" type="number" min="6" value="22" /></label>
      <button id="start-btn" class="btn btn-primary" type="button" data-i18n="start">开始拼豆</button>
    </div>
    <div class="hint" data-i18n="startHint">点击「开始拼豆」会新建一个名为「拼豆板」的表并把格子调成正方形，然后跳转过去。</div>
    <div id="rebuild-confirm" class="confirm-bar" style="display:none">
      <div class="confirm-msg" data-i18n-html="rebuildMsg">「拼豆板」已存在，<b>重制会清空现有图案</b>。确定重制？</div>
      <div class="confirm-actions">
        <button id="confirm-rebuild" type="button" class="btn btn-primary btn-sm" data-i18n="rebuildYes">确认重制</button>
        <button id="cancel-rebuild" type="button" class="btn btn-sm" data-i18n="cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="codesTitle">色号显示</div>
    <div class="row">
      <button id="toggle-values" class="btn" type="button">隐藏色号</button>
      <span class="hint" style="margin:0" data-i18n="codesHint">拼豆时会把色号写进每个格子，可作「按号涂色」图纸；这里切换画布上是否显示色号。</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="brushesTitle">当前画笔</div>
    <div class="brushes">
      <div class="brush">
        <span class="key" data-i18n="leftKey">左键 L</span>
        <div id="left-swatch" class="swatch-lg"></div>
        <div class="meta"><div id="left-name" class="name">未选</div><div id="left-code" class="code"></div></div>
      </div>
      <div class="brush">
        <span class="key" data-i18n="rightKey">右键 R</span>
        <div id="right-swatch" class="swatch-lg"></div>
        <div class="meta"><div id="right-name" class="name">未选</div><div id="right-code" class="code"></div></div>
      </div>
    </div>
    <div class="hint" data-i18n-html="brushHint">在下方「我的工作区」里：<b>左键</b>点色块设为左键画笔，<b>右键</b>点色块设为右键画笔。<br/>在画布上：左键涂左色，右键涂右色，按住拖动可连续涂。<b>Ctrl/⌘ + 滚轮</b>（或触控板双指捏合）缩放画布。</div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="workspaceTitle">我的工作区</div>
    <div id="workspace" class="ws"></div>
  </div>

  <div class="card">
    <div class="section-title" data-i18n="paletteTitle">选豆区</div>
    <div id="palette"></div>
  </div>

  <script src="./fuse-beads.js"></script>
  <script>
    // ---- language ----------------------------------------------------
    //
    // The host tells a craft which language it is speaking (`window.locale`,
    // a BCP-47 tag) and offers to say so again when the user switches
    // (`window.onLocaleChange`). Both are optional: opened standalone, or in
    // an older host, neither exists and the craft stays in its default
    // language — which is why `pickLocale` falls back rather than throwing.
    //
    // The board's SHEET NAME is deliberately not translated: it is the key
    // this craft finds its sheet by, and renaming it per language would
    // orphan every game already saved in a workbook.
    var STRINGS = {
      'zh-CN': {
        title: '电子拼豆',
        subtitle: 'Fuse Beads · MARD 色板 — 在表格上一格一格拼出你的像素图',
        rows: '行', cols: '列', cellSide: '格边(px)',
        start: '开始拼豆',
        startHint: '点击「开始拼豆」会新建一个名为「拼豆板」的表并把格子调成正方形，然后跳转过去。',
        rebuildMsg: '「拼豆板」已存在，<b>重制会清空现有图案</b>。确定重制？',
        rebuildYes: '确认重制', cancel: '取消',
        codesTitle: '色号显示',
        codesHint: '拼豆时会把色号写进每个格子，可作「按号涂色」图纸；这里切换画布上是否显示色号。',
        hideCodes: '隐藏色号', showCodes: '显示色号',
        brushesTitle: '当前画笔',
        leftKey: '左键 L', rightKey: '右键 R',
        brushHint: '在下方「我的工作区」里：<b>左键</b>点色块设为左键画笔，<b>右键</b>点色块设为右键画笔。<br/>在画布上：左键涂左色，右键涂右色，按住拖动可连续涂。<b>Ctrl/⌘ + 滚轮</b>（或触控板双指捏合）缩放画布。',
        workspaceTitle: '我的工作区',
        paletteTitle: '选豆区',
        unset: '未选', eraser: '橡皮', erase: '擦除',
        wsEmpty: '从下面「选豆区」点选颜色，加到这里',
        eraserTip: '橡皮：左键点设为左画笔，右键点设为右画笔',
        beadTip: ' — 左键设左画笔，右键设右画笔',
        removeFromWs: '从工作区移除',
        paintFailed: '涂色失败：',
        notReady: '工作簿尚未就绪，请稍候再试',
        creating: '正在创建…',
        boardReady: '拼豆板已就绪，开始拼豆吧！',
        createFailed: '创建拼豆板失败：'
      },
      en: {
        title: 'Fuse Beads',
        subtitle: 'Fuse Beads · MARD palette — build a pixel picture one cell at a time',
        rows: 'Rows', cols: 'Cols', cellSide: 'Cell (px)',
        start: 'Start beading',
        startHint: 'Pressing “Start beading” creates a sheet for the board, squares up its cells, and jumps you to it.',
        rebuildMsg: 'The board sheet already exists, and <b>rebuilding wipes the current picture</b>. Rebuild it?',
        rebuildYes: 'Rebuild', cancel: 'Cancel',
        codesTitle: 'Colour codes',
        codesHint: 'Beading writes each bead\u2019s code into its cell, so the board doubles as a colour-by-number chart; this toggles whether the codes show on the canvas.',
        hideCodes: 'Hide codes', showCodes: 'Show codes',
        brushesTitle: 'Current brushes',
        leftKey: 'Left L', rightKey: 'Right R',
        brushHint: 'In “My workspace” below: <b>left-click</b> a swatch to set the left brush, <b>right-click</b> for the right brush.<br/>On the canvas: left-click paints the left colour, right-click the right one, and dragging paints continuously. <b>Ctrl/\u2318 + wheel</b> (or a trackpad pinch) zooms.',
        workspaceTitle: 'My workspace',
        paletteTitle: 'Bead picker',
        unset: 'None', eraser: 'Eraser', erase: 'Erase',
        wsEmpty: 'Pick colours from the bead picker below to add them here',
        eraserTip: 'Eraser: left-click to set as the left brush, right-click for the right one',
        beadTip: ' — left-click sets the left brush, right-click the right one',
        removeFromWs: 'Remove from the workspace',
        paintFailed: 'Could not paint: ',
        notReady: 'The workbook is not ready yet — try again in a moment',
        creating: 'Creating…',
        boardReady: 'The board is ready — start beading!',
        createFailed: 'Could not create the board: '
      }
    }

    // NOT `locale`: a top-level `var locale` IS `window.locale`, the
    // property the host injects — same binding, so each would silently
    // overwrite the other.
    var craftLocale = 'zh-CN'

    /** Nearest language we actually have, for whatever the host reports. */
    function pickLocale(tag) {
      if (!tag) return 'zh-CN'
      if (STRINGS[tag]) return tag
      var base = String(tag).replace('_', '-').split('-')[0].toLowerCase()
      if (base === 'zh') return 'zh-CN'
      if (base === 'en') return 'en'
      return 'zh-CN'
    }

    /** A string, with `{{name}}` filled in from `vars`. */
    function T(key, vars) {
      var d = STRINGS[craftLocale] || STRINGS['zh-CN']
      var s = d[key] != null ? d[key] : key
      if (!vars) return s
      return s.replace(/\{\{(\w+)\}\}/g, function (_, k) {
        return vars[k] != null ? vars[k] : ''
      })
    }

    function applyLocale(tag) {
      craftLocale = pickLocale(tag)
      document.documentElement.lang = craftLocale
      var els = document.querySelectorAll('[data-i18n]')
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = T(els[i].getAttribute('data-i18n'))
      }
      var html = document.querySelectorAll('[data-i18n-html]')
      for (var j = 0; j < html.length; j++) {
        html[j].innerHTML = T(html[j].getAttribute('data-i18n-html'))
      }
      if (typeof onLocaleApplied === 'function') onLocaleApplied()
    }
    // ---- state -------------------------------------------------------------
    var boardSheetIdx = null
    var boardFontPt = 8       // font size for the color code written into a cell
    var showValues = true     // whether the engine renders the written codes
    // brush: null (none) | 'ERASER' | bead code string
    var leftBrush = null
    var rightBrush = null
    var chosen = ['ERASER'] // codes shown in the workspace; eraser is always there
    var activeCat = null    // active palette category key (selects which tab shows)
    var dragBtn = null      // 0 = left drag, 2 = right drag, null = idle
    var lastKey = null      // last painted "r:c", to dedupe drag strokes

    function notify(level, msg) {
      try { if (window.notifyCraft) window.notifyCraft(level, msg) } catch (e) {}
      if (level === 'error') console.error('[fuse-beads]', msg)
    }

    function brushHex(brush) {
      if (brush === null) return undefined // no paint
      if (brush === 'ERASER') return null   // clear fill
      var b = FuseBeads.BEAD_BY_CODE[brush]
      return b ? b.hex : undefined
    }
    // The color code written into the cell. Eraser / no-brush write nothing;
    // a real brush IS its bead code (e.g. "A1", "ZG8").
    function brushCode(brush) {
      return (brush === null || brush === 'ERASER') ? '' : brush
    }

    // ---- current-brush display --------------------------------------------
    function renderBrush(side) {
      var brush = side === 'left' ? leftBrush : rightBrush
      var sw = document.getElementById(side + '-swatch')
      var nameEl = document.getElementById(side + '-name')
      var codeEl = document.getElementById(side + '-code')
      sw.className = 'swatch-lg'
      if (brush === null) {
        sw.style.background = ''
        nameEl.textContent = T('unset'); codeEl.textContent = ''
      } else if (brush === 'ERASER') {
        sw.style.background = ''
        sw.classList.add('eraser-face')
        nameEl.textContent = T('eraser'); codeEl.textContent = T('erase')
      } else {
        var b = FuseBeads.BEAD_BY_CODE[brush]
        sw.style.background = b.hex
        nameEl.textContent = b.code; codeEl.textContent = b.hex.toUpperCase()
      }
    }
    function renderBrushes() { renderBrush('left'); renderBrush('right') }

    // ---- workspace ---------------------------------------------------------
    function assignBrush(side, brush) {
      if (side === 'left') leftBrush = brush; else rightBrush = brush
      renderBrushes()
    }
    function faceStyle(el, brush) {
      if (brush === 'ERASER') { el.classList.add('eraser-face'); el.style.background = '' }
      else { el.style.background = FuseBeads.BEAD_BY_CODE[brush].hex }
    }
    function renderWorkspace() {
      var ws = document.getElementById('workspace')
      ws.innerHTML = ''
      if (chosen.length === 0) {
        var empty = document.createElement('div')
        empty.className = 'ws-empty'
        empty.textContent = T('wsEmpty')
        ws.appendChild(empty)
        return
      }
      chosen.forEach(function (code) {
        var item = document.createElement('div')
        item.className = 'ws-item'

        var sw = document.createElement('div')
        sw.className = 'swatch'
        faceStyle(sw, code)
        sw.title = code === 'ERASER'
          ? T('eraserTip')
          : (FuseBeads.BEAD_BY_CODE[code].code + ' ' + FuseBeads.BEAD_BY_CODE[code].hex +
             T('beadTip'))
        var label = document.createElement('span')
        label.className = 'code'
        label.textContent = code === 'ERASER' ? T('eraser') : FuseBeads.BEAD_BY_CODE[code].code
        sw.appendChild(label)

        sw.addEventListener('click', function () { assignBrush('left', code) })
        sw.addEventListener('contextmenu', function (ev) {
          ev.preventDefault(); assignBrush('right', code)
        })
        item.appendChild(sw)

        if (code !== 'ERASER') {
          var rm = document.createElement('button')
          rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×'
          rm.title = T('removeFromWs')
          rm.addEventListener('click', function (ev) {
            ev.stopPropagation()
            chosen = chosen.filter(function (c) { return c !== code })
            if (leftBrush === code) assignBrush('left', null)
            if (rightBrush === code) assignBrush('right', null)
            renderWorkspace(); renderPalette()
          })
          item.appendChild(rm)
        }
        ws.appendChild(item)
      })
    }

    // ---- palette -----------------------------------------------------------
    function togglePick(code) {
      if (chosen.indexOf(code) >= 0) {
        chosen = chosen.filter(function (c) { return c !== code })
        if (leftBrush === code) assignBrush('left', null)
        if (rightBrush === code) assignBrush('right', null)
      } else {
        chosen.push(code)
      }
      renderWorkspace(); renderPalette()
    }
    function renderPalette() {
      var root = document.getElementById('palette')
      root.innerHTML = ''
      var cats = FuseBeads.PALETTE.filter(function (c) { return c.beads.length })
      if (activeCat === null && cats.length) activeCat = cats[0].key

      // Category tabs (one row, wraps). Only the active category's grid shows,
      // so the panel height stays fixed no matter how many colors exist.
      var tabs = document.createElement('div')
      tabs.className = 'tabs'
      cats.forEach(function (c) {
        var t = document.createElement('button')
        t.type = 'button'
        t.className = 'tab' + (c.key === activeCat ? ' active' : '')
        t.innerHTML = c.label + '<span class="count">' + c.beads.length + '</span>'
        t.addEventListener('click', function () { activeCat = c.key; renderPalette() })
        tabs.appendChild(t)
      })
      root.appendChild(tabs)

      var body = document.createElement('div')
      body.className = 'palette-body'
      var grid = document.createElement('div')
      grid.className = 'swatches'
      var cat = cats.find(function (c) { return c.key === activeCat })
      ;(cat ? cat.beads : []).forEach(function (b) {
        var sw = document.createElement('div')
        sw.className = 'swatch' + (chosen.indexOf(b.code) >= 0 ? ' picked' : '')
        sw.style.background = b.hex
        sw.title = b.code // full official MARD code, shown on hover
        var lab = document.createElement('span')
        lab.className = 'code'; lab.textContent = b.num // number within the series tab
        sw.appendChild(lab)
        sw.addEventListener('click', function () { togglePick(b.code) })
        grid.appendChild(sw)
      })
      body.appendChild(grid)
      root.appendChild(body)
    }

    // ---- painting (canvas input) ------------------------------------------
    function paintAt(row, col, brush) {
      var hex = brushHex(brush)
      if (hex === undefined) return false // no brush on this button → let engine select
      var key = row + ':' + col
      if (key === lastKey) return true
      lastKey = key
      FuseBeads.paintCell(window.workbook, boardSheetIdx, row, col, hex, brushCode(brush), boardFontPt)
        .catch(function (e) { notify('error', T('paintFailed') + (e && e.message || e)) })
      return true
    }

    function canvasHandler(e) {
      // Zooming is the engine's own gesture now (Ctrl/⌘ + wheel, or a
      // trackpad pinch), so this craft doesn't handle wheel at all.
      // Everything below only applies on the bead board.
      if (boardSheetIdx === null || e.sheetIdx !== boardSheetIdx) return false

      switch (e.type) {
        case 'contextmenu':
          return true // never show the native right-click menu on the board
        case 'mousedown':
          if (e.row == null || e.col == null) return false
          lastKey = null
          if (e.button === 0) { dragBtn = 0; paintAt(e.row, e.col, leftBrush) }
          else if (e.button === 2) { dragBtn = 2; paintAt(e.row, e.col, rightBrush) }
          else { dragBtn = null }
          // Always consume mousedown on the board. Besides painting, this blocks
          // the stray cell selection AND the engine's double-click-to-edit —
          // which it detects from a rapid SECOND mousedown (not a dblclick
          // event), so consuming mousedown is the only way to stop the formula
          // editor from opening while painting.
          return true
        case 'mousemove':
          if (dragBtn === null) return false
          var mask = dragBtn === 0 ? 1 : 2
          if (!(e.buttons & mask)) { dragBtn = null; return false }
          if (e.row != null && e.col != null)
            paintAt(e.row, e.col, dragBtn === 0 ? leftBrush : rightBrush)
          return true
        case 'mouseup':
          dragBtn = null; lastKey = null; return true
        case 'click':
        case 'dblclick':
          return true // never select or open the editor on the board
      }
      return false
    }

    // ---- show / hide the written color codes -------------------------------
    function applyShowValues() {
      var btn = document.getElementById('toggle-values')
      if (btn) btn.textContent = showValues ? T('hideCodes') : T('showCodes')
      if (window.setShowCellValues) window.setShowCellValues(showValues)
    }
    function toggleValues() {
      showValues = !showValues
      applyShowValues()
    }

    // ---- start / setup -----------------------------------------------------
    function showRebuildConfirm(show) {
      document.getElementById('rebuild-confirm').style.display = show ? 'block' : 'none'
    }

    // Clicking 开始拼豆: if the board already exists, ask before wiping it.
    async function start() {
      if (!window.workbook) { notify('error', T('notReady')); return }
      var exists = false
      try {
        exists = (await FuseBeads.findBoardSheetIdx(window.workbook)) >= 0
      } catch (e) { /* treat as not-exists; build() will surface real errors */ }
      if (exists) { showRebuildConfirm(true); return }
      await build()
    }

    // Actually (re)build the board. Rebuild deletes the old board and makes a
    // fresh one — only reached for a brand-new board or after the user confirms.
    // The new sheet is named in the host's language (FuseBeads.boardName), so a
    // rebuild after a language switch also renames the tab.
    async function build() {
      showRebuildConfirm(false)
      var btn = document.getElementById('start-btn')
      btn.disabled = true; var old = btn.textContent; btn.textContent = T('creating')
      try {
        var opts = {
          rows: parseInt(document.getElementById('rows-input').value, 10) || 120,
          cols: parseInt(document.getElementById('cols-input').value, 10) || 120,
          sidePx: parseInt(document.getElementById('side-input').value, 10) || 22,
        }
        // If we're rebuilding an EXISTING board, move the view off it first:
        // setupBoard deletes the old board, and the canvas crashes if it's asked to
        // render the sheet that just disappeared. Sheet index 0 always exists.
        // Yield a couple of frames so the view actually switches before delete.
        var existingIdx = -1
        try { existingIdx = await FuseBeads.findBoardSheetIdx(window.workbook) } catch (e) {}
        if (existingIdx >= 0 && window.setSelection) {
          window.setSelection(0, 0, 0)
          await new Promise(function (r) {
            requestAnimationFrame(function () { requestAnimationFrame(r) })
          })
        }
        var idx = await FuseBeads.setupBoard(window.workbook, opts, craftLocale)
        boardSheetIdx = idx
        boardFontPt = FuseBeads.labelFontPt(opts.sidePx)
        if (window.setSelection) window.setSelection(idx, 0, 0)
        notify('success', T('boardReady'))
      } catch (e) {
        notify('error', T('createFailed') + (e && e.message || e))
      } finally {
        btn.disabled = false; btn.textContent = old
      }
    }

    // ---- boot --------------------------------------------------------------
    function whenHostReady(cb) {
      var tries = 0
      ;(function loop() {
        if (typeof window.onCanvasInput === 'function') { cb(); return }
        if (tries++ > 600) { console.warn('[fuse-beads] host APIs not injected'); return }
        setTimeout(loop, 50)
      })()
    }

    // Re-render the strings this craft builds in JS when the language
    // changes; `applyLocale` calls this after swapping the static markup.
    function onLocaleApplied() {
      try {
        renderBrushes()
        renderWorkspace()
        // Just the label — `applyShowValues` would also re-push the setting
        // to the host, which a language change has no business doing.
        var btn = document.getElementById('toggle-values')
        if (btn) btn.textContent = showValues ? T('hideCodes') : T('showCodes')
      } catch (e) { /* before the first render there is nothing to redo */ }
    }

    function init() {
      // The page's own language, for the moment before the host has injected
      // anything (and forever, when opened standalone).
      applyLocale(window.locale)
      renderBrushes()
      renderWorkspace()
      renderPalette()
      document.getElementById('start-btn').addEventListener('click', start)
      document.getElementById('toggle-values').addEventListener('click', toggleValues)
      document.getElementById('confirm-rebuild').addEventListener('click', build)
      document.getElementById('cancel-rebuild').addEventListener('click', function () {
        showRebuildConfirm(false)
      })
      // Register the canvas paint handler once the host has injected it,
      // and hide the cell selection — this craft paints, it doesn't select, so
      // the selection box would just get in the way.
      whenHostReady(function () {
        // Now that the host has injected, take its language and keep
        // following it. This has to be here, not in `init`: the iframe's
        // DOMContentLoaded fires before the parent's injection, so at init
        // time `window.locale` is still undefined.
        applyLocale(window.locale)
        if (typeof window.onLocaleChange === 'function') {
          window.onLocaleChange(applyLocale)
        }
        window.onCanvasInput(canvasHandler)
        if (window.setSelectionSuppressed) window.setSelectionSuppressed(true)
        // The engine's cell-value visibility is app-global and survives a craft
        // reload; adopt its current state so the button label matches reality.
        if (window.getShowCellValues) showValues = window.getShowCellValues()
        applyShowValues()
      })
    }

    window.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
