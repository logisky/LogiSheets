<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title">记忆挑战</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f5f7; color: #111827; font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,0.06);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .level-line { font-size: 15px; font-weight: 700; }
    .best { color: #6b7280; font-size: 12px; }
    .bar { height: 8px; border-radius: 999px; background: #e5e7eb; overflow: hidden; margin: 10px 0; }
    .bar > div { height: 100%; background: #2563eb; width: 0; transition: width .2s; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; font-size: 14px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #111827; cursor: pointer;
    }
    .btn:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .link { background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    .status { font-size: 14px; font-weight: 600; }
    .question { font-size: 15px; margin: 8px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); display: inline-block; vertical-align: middle; }
    .count { color: #6b7280; font-size: 12px; }
    .result-pass { color: #15803d; font-weight: 700; font-size: 15px; }
    .result-fail { color: #b91c1c; font-weight: 700; font-size: 15px; }
    .hint { color: #6b7280; font-size: 11px; line-height: 1.6; margin-top: 8px; }
    .hidden { display: none !important; }
    .big { font-size: 22px; font-weight: 800; text-align: center; padding: 6px 0; }
  </style>
</head>
<body>
  <h1 data-i18n="title">记忆挑战</h1>
  <div class="subtitle" data-i18n="subtitle">Memory Grid — 记住闪现格子的颜色和数字，共 24 关</div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <span id="level-line" class="level-line">第 1 / 24 关</span>
      <span id="best" class="best">最高通关：0</span>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="row">
      <button id="start-btn" class="btn btn-primary" type="button" data-i18n="start">开始本关</button>
      <button id="reset-btn" class="link" type="button" data-i18n="resetProgress">重置进度</button>
    </div>
    <div id="allclear" class="big hidden" data-i18n="allClear">🎉 全部 24 关通关！</div>
  </div>

  <div id="play-card" class="card hidden">
    <div id="status" class="status">准备…</div>
    <div id="question" class="question hidden"></div>
    <div id="pick-count" class="count hidden"></div>
    <div class="row" style="margin-top: 8px;">
      <button id="confirm-btn" class="btn btn-primary hidden" type="button" data-i18n="confirm">确认</button>
    </div>
    <div id="result" class="row hidden" style="margin-top: 8px; gap: 10px;">
      <span id="result-msg"></span>
      <button id="next-btn" class="btn btn-primary hidden" type="button" data-i18n="next">下一关</button>
      <button id="retry-btn" class="btn hidden" type="button" data-i18n="retry">重试本关</button>
    </div>
  </div>

  <div class="card">
    <div class="hint" data-i18n-html="hint">
      玩法：点「开始本关」后，格子会一个个闪现颜色/数字，记住它们；闪完根据问题在棋盘上<b>点选</b>对应的格子（再点一次取消），选够后点「确认」。<br/>
      答错会揭示正确答案（绿色），可重试本关；答对进入下一关，进度会自动保存。
    </div>
  </div>

  <script src="./memory-grid.js"></script>
  <script>
    var MG = window.MemoryGrid

    // ---- language ----------------------------------------------------
    //
    // The host tells a craft which language it is speaking (`window.locale`,
    // a BCP-47 tag) and offers to say so again when the user switches
    // (`window.onLocaleChange`). Both are optional: opened standalone, or in
    // an older host, neither exists and the craft stays in its default
    // language — which is why `pickLocale` falls back rather than throwing.
    //
    // The board's SHEET NAME follows the language too (the tab is something
    // the player reads). It is also how the craft finds its board again, so
    // lookups go through the module's findBoardSheet, which knows every name
    // we ship — a game started in Chinese is still found after a switch to
    // English, and the sheet is renamed rather than duplicated.
    var STRINGS = {
      'zh-CN': {
        title: '记忆挑战',
        subtitle: 'Memory Grid — 记住闪现格子的颜色和数字，共 24 关',
        start: '开始本关',
        resetProgress: '重置进度',
        allClear: '🎉 全部 24 关通关！',
        confirm: '确认',
        next: '下一关',
        retry: '重试本关',
        hint: '玩法：点「开始本关」后，格子会一个个闪现颜色/数字，记住它们；闪完根据问题在棋盘上<b>点选</b>对应的格子（再点一次取消），选够后点「确认」。<br/>答错会揭示正确答案（绿色），可重试本关；答对进入下一关，进度会自动保存。',
        levelLine: '第 {{level}} / {{total}} 关',
        levelAllClear: '已全部通关',
        bestLine: '最高通关：{{best}}',
        picked: '已选 {{n}} / {{total}}',
        ready: '准备…',
        memorise: '记住！ ({{shown}} / {{total}})',
        yourTurn: '轮到你了 👇',
        pass: '✅ 通过！',
        passAll: '✅ 通过！全部 24 关完成 🎉',
        fail: '❌ 差一点！绿色是正确答案。',
        notReady: '工作簿尚未就绪',
        failed: '出错了：',
        colors: ['红', '橙', '黄', '绿', '青', '蓝', '紫', '粉'],
        qCount: '（共 {{count}} 个）',
        qColor: '选出出现过 {{color}} 色的格子{{suffix}}',
        qNumber: '选出出现过数字 {{number}} 的格子{{suffix}}',
        qBoth: '选出 {{color}} 色、且数字为 {{number}} 的格子{{suffix}}'
      },
      en: {
        title: 'Memory Grid',
        subtitle: 'Memory Grid — remember the colours and numbers that flash, across 24 levels',
        start: 'Start level',
        resetProgress: 'Reset progress',
        allClear: '🎉 All 24 levels cleared!',
        confirm: 'Confirm',
        next: 'Next level',
        retry: 'Retry level',
        hint: 'How to play: press “Start level” and the cells flash a colour/number one at a time — remember them. When the flashing stops, answer the question by <b>clicking</b> the matching cells on the board (click again to deselect), then press “Confirm”.<br/>A wrong answer reveals the correct cells in green and you can retry; a right one moves you on, and progress saves itself.',
        levelLine: 'Level {{level}} / {{total}}',
        levelAllClear: 'All levels cleared',
        bestLine: 'Best: {{best}}',
        picked: 'Picked {{n}} / {{total}}',
        ready: 'Ready…',
        memorise: 'Remember! ({{shown}} / {{total}})',
        yourTurn: 'Your turn 👇',
        pass: '✅ Correct!',
        passAll: '✅ Correct! All 24 levels done 🎉',
        fail: '❌ So close! The green cells are the answer.',
        notReady: 'The workbook is not ready yet',
        failed: 'Something went wrong: ',
        colors: ['Red', 'Orange', 'Yellow', 'Green', 'Cyan', 'Blue', 'Purple', 'Pink'],
        qCount: ' ({{count}} of them)',
        qColor: 'Pick the cells that showed {{color}}{{suffix}}',
        qNumber: 'Pick the cells that showed the number {{number}}{{suffix}}',
        qBoth: 'Pick the cells that were {{color}} AND showed {{number}}{{suffix}}'
      }
    }

    // NOT `locale`: a top-level `var locale` IS `window.locale`, the
    // property the host injects — same binding, so each would silently
    // overwrite the other.
    var craftLocale = 'zh-CN'

    /**
     * The language this page's own URL asks for (`?lang=`), which the host
     * puts there when it opens the craft.
     *
     * `window.locale` is authoritative, but it only exists once the host has
     * injected — a beat after this page has already rendered its markup, which
     * is written in one language. Reading it from the URL instead needs
     * nothing but the address bar, so the first paint is already right; the
     * host speaking English used to watch the Chinese markup flash past first.
     */
    function urlLocale() {
      try {
        return new URLSearchParams(window.location.search).get('lang') || undefined
      } catch (e) {
        return undefined
      }
    }

    /** Nearest language we actually have, for whatever the host reports. */
    function pickLocale(tag) {
      var want = tag || urlLocale()
      if (!want) return 'zh-CN'
      if (STRINGS[want]) return want
      var base = String(want).replace('_', '-').split('-')[0].toLowerCase()
      if (base === 'zh') return 'zh-CN'
      if (base === 'en') return 'en'
      return 'zh-CN'
    }

    /** A string, with `{{name}}` filled in from `vars`. */
    function T(key, vars) {
      var d = STRINGS[craftLocale] || STRINGS['zh-CN']
      var s = d[key] != null ? d[key] : key
      if (!vars) return s
      return s.replace(/\{\{(\w+)\}\}/g, function (_, k) {
        return vars[k] != null ? vars[k] : ''
      })
    }

    function applyLocale(tag) {
      craftLocale = pickLocale(tag)
      document.documentElement.lang = craftLocale
      var els = document.querySelectorAll('[data-i18n]')
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = T(els[i].getAttribute('data-i18n'))
      }
      var html = document.querySelectorAll('[data-i18n-html]')
      for (var j = 0; j < html.length; j++) {
        html[j].innerHTML = T(html[j].getAttribute('data-i18n-html'))
      }
      // The board's tab is part of the UI too, so a language switch renames
      // the sheet. Nothing to do before the host has injected a workbook, and
      // a failed rename just leaves the old name — never break the page over a
      // tab label.
      if (window.workbook && MG) {
        MG.renameBoardToLocale(window.workbook, craftLocale).catch(function () {})
      }
      if (typeof onLocaleApplied === 'function') onLocaleApplied()
    }

    /**
     * The question, in the current language.
     *
     * The bundle hands back a STRUCTURED question (type / colorIdx / number /
     * count) plus a pre-built `text`; only the structure is used here, so the
     * wording — including the colour names — lives with the rest of the UI
     * strings instead of being frozen into the bundle at build time.
     */
    function questionText(q) {
      var suffix = q.count > 1 ? T('qCount', {count: q.count}) : ''
      var color = (T('colors') || [])[q.colorIdx]
      if (q.type === 'color') return T('qColor', {color: color, suffix: suffix})
      if (q.type === 'number') return T('qNumber', {number: q.number, suffix: suffix})
      return T('qBoth', {color: color, number: q.number, suffix: suffix})
    }
    var boardSheetIdx = null
    var progress = {level: 1, best: 0}
    var round = null
    var spec = null
    var phase = 'idle' // idle | showing | answering | result
    var chosen = new Set()
    var busy = false

    var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms) }) }

    function notify(level, msg) {
      try { if (window.notifyCraft) window.notifyCraft(level, msg) } catch (e) {}
      if (level === 'error') console.error('[memory-grid]', msg)
    }

    // ---- progress / craft-state -------------------------------------
    function loadProgress() {
      var json = window.getCraftState ? window.getCraftState() : undefined
      progress = MG.parseProgress(json)
    }
    function saveProgress() {
      if (window.setCraftState) window.setCraftState(MG.serializeProgress(progress))
    }

    // ---- rendering --------------------------------------------------
    function renderHeader() {
      var allClear = progress.level > MG.TOTAL_LEVELS
      document.getElementById('level-line').textContent = allClear
        ? T('levelAllClear')
        : T('levelLine', {level: progress.level, total: MG.TOTAL_LEVELS})
      document.getElementById('best').textContent = T('bestLine', {best: progress.best})
      document.getElementById('bar-fill').style.width =
        Math.round((progress.best / MG.TOTAL_LEVELS) * 100) + '%'
      document.getElementById('allclear').classList.toggle('hidden', !allClear)
      document.getElementById('start-btn').classList.toggle('hidden', allClear)
    }

    function show(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible) }

    function renderQuestion() {
      var q = round.question
      var el = document.getElementById('question')
      el.innerHTML = ''
      var text = document.createElement('span')
      // insert a color swatch where relevant
      if (q.type === 'color' || q.type === 'both') {
        var sw = document.createElement('span')
        sw.className = 'swatch'
        sw.style.background = MG.COLORS[q.colorIdx].hex
        el.appendChild(sw)
      }
      text.textContent = questionText(q)
      el.appendChild(text)
      updatePickCount()
    }

    function updatePickCount() {
      var el = document.getElementById('pick-count')
      el.textContent = T('picked', {n: chosen.size, total: round.question.count})
    }

    // ---- board / picking --------------------------------------------
    function togglePick(row, col) {
      var key = row + ':' + col
      if (chosen.has(key)) {
        chosen.delete(key)
        MG.paintMark(window.workbook, boardSheetIdx, row, col, null).catch(function (e) { notify('error', e) })
      } else {
        chosen.add(key)
        MG.paintMark(window.workbook, boardSheetIdx, row, col, MG.MARK_HEX).catch(function (e) { notify('error', e) })
      }
      updatePickCount()
    }

    function canvasHandler(e) {
      if (boardSheetIdx === null || e.sheetIdx !== boardSheetIdx) return false
      switch (e.type) {
        case 'contextmenu':
          return true
        case 'mousedown':
          if (phase === 'answering' && e.button === 0 && e.row != null && e.col != null)
            togglePick(e.row, e.col)
          // Always consume on the board: blocks stray selection AND the
          // engine's double-click-to-edit (detected from a 2nd mousedown).
          return true
        case 'click':
        case 'dblclick':
        case 'mouseup':
          return true
      }
      return false
    }

    // ---- game flow --------------------------------------------------
    async function startLevel() {
      if (busy) return
      if (!window.workbook) { notify('error', T('notReady')); return }
      if (progress.level > MG.TOTAL_LEVELS) return
      busy = true
      spec = MG.getLevel(progress.level)
      chosen = new Set()
      round = MG.generateRound(spec)

      show('play-card', true)
      show('question', false); show('pick-count', false)
      show('confirm-btn', false); show('result', false)
      show('next-btn', false); show('retry-btn', false)
      document.getElementById('start-btn').disabled = true
      var statusEl = document.getElementById('status')
      statusEl.textContent = T('ready')
      phase = 'showing'

      try {
        boardSheetIdx = await MG.ensureBoard(window.workbook, craftLocale)
        if (window.setSelection) window.setSelection(boardSheetIdx, 0, 0)
        await sleep(150)
        await MG.clearBoard(window.workbook, boardSheetIdx)
        await sleep(600)

        // Flash the sequence, grouped by `simultaneous`.
        var order = round.order
        var groups = []
        for (var i = 0; i < order.length; i += spec.simultaneous)
          groups.push(order.slice(i, i + spec.simultaneous))
        var shown = 0
        for (var g = 0; g < groups.length; g++) {
          var cs = groups[g].map(function (idx) { return round.cells[idx] })
          shown += cs.length
          statusEl.textContent = T('memorise', {shown: shown, total: round.cells.length})
          await MG.showCells(window.workbook, boardSheetIdx, cs)
          await sleep(spec.showMs)
          await MG.clearCells(window.workbook, boardSheetIdx, cs)
          await sleep(180)
        }

        // Answer phase.
        phase = 'answering'
        statusEl.textContent = T('yourTurn')
        renderQuestion()
        show('question', true); show('pick-count', true); show('confirm-btn', true)
      } catch (e) {
        notify('error', T('failed') + (e && e.message || e))
        phase = 'idle'
        document.getElementById('start-btn').disabled = false
      } finally {
        busy = false
      }
    }

    async function confirmAnswer() {
      if (busy || phase !== 'answering') return
      busy = true
      try {
        var answerKeys = new Set(round.answerCells.map(function (c) { return c.row + ':' + c.col }))
        var ok = chosen.size === answerKeys.size &&
          [].every.call(Array.from(chosen), function (k) { return answerKeys.has(k) })

        phase = 'result'
        show('confirm-btn', false)
        show('result', true)
        var msg = document.getElementById('result-msg')

        if (ok) {
          // brief green confirm on the answer cells
          for (var c of round.answerCells)
            await MG.paintMark(window.workbook, boardSheetIdx, c.row, c.col, MG.RIGHT_HEX)
          progress.best = Math.max(progress.best, progress.level)
          progress.level = Math.min(progress.level + 1, MG.TOTAL_LEVELS + 1)
          saveProgress()
          renderHeader()
          msg.className = 'result-pass'
          msg.textContent = T('pass')
          if (progress.level > MG.TOTAL_LEVELS) {
            msg.textContent = T('passAll')
          } else {
            show('next-btn', true)
          }
        } else {
          // reveal: wrong picks red, correct cells green
          for (var k of Array.from(chosen)) {
            if (!answerKeys.has(k)) {
              var p = k.split(':')
              await MG.paintMark(window.workbook, boardSheetIdx, +p[0], +p[1], MG.WRONG_HEX)
            }
          }
          for (var a of round.answerCells)
            await MG.paintMark(window.workbook, boardSheetIdx, a.row, a.col, MG.RIGHT_HEX)
          msg.className = 'result-fail'
          msg.textContent = T('fail')
          show('retry-btn', true)
        }
        document.getElementById('status').textContent = ''
      } catch (e) {
        notify('error', e)
      } finally {
        busy = false
      }
    }

    function endToMenu() {
      show('play-card', false)
      phase = 'idle'
      document.getElementById('start-btn').disabled = false
      renderHeader()
    }

    async function resetProgress() {
      progress = {level: 1, best: 0}
      saveProgress()
      if (boardSheetIdx !== null && window.workbook)
        await MG.clearBoard(window.workbook, boardSheetIdx).catch(function () {})
      endToMenu()
    }

    // ---- boot -------------------------------------------------------
    function whenHostReady(cb) {
      var tries = 0
      ;(function loop() {
        if (typeof window.onCanvasInput === 'function' && window.workbook) { cb(); return }
        if (tries++ > 600) { console.warn('[memory-grid] host APIs not injected'); return }
        setTimeout(loop, 50)
      })()
    }

    // Re-render the strings this craft builds in JS when the language
    // changes; `applyLocale` calls this after swapping the static markup.
    function onLocaleApplied() {
      // `progress`, not just the module: applyLocale now also runs while the
      // page is still parsing (see the call next to the DOMContentLoaded
      // registration), and renderHeader reads progress.level.
      if (MG && progress) renderHeader()
      // renderQuestion rebuilds the swatch + text and refreshes the pick
      // count, so one call covers everything a language change touches.
      if (round && round.question) renderQuestion()
    }

    function init() {
      MG = window.MemoryGrid
      // The page's own language, for the moment before the host has injected
      // anything (and forever, when opened standalone).
      applyLocale(window.locale)
      renderHeader()
      document.getElementById('start-btn').addEventListener('click', startLevel)
      document.getElementById('confirm-btn').addEventListener('click', confirmAnswer)
      document.getElementById('next-btn').addEventListener('click', function () {
        show('result', false); startLevel()
      })
      document.getElementById('retry-btn').addEventListener('click', function () {
        show('result', false); startLevel()
      })
      document.getElementById('reset-btn').addEventListener('click', resetProgress)

      whenHostReady(function () {
        // Now that the host has injected, take its language and keep
        // following it. This has to be here, not in `init`: the iframe's
        // DOMContentLoaded fires before the parent's injection, so at init
        // time `window.locale` is still undefined.
        applyLocale(window.locale)
        if (typeof window.onLocaleChange === 'function') {
          window.onLocaleChange(applyLocale)
        }
        window.onCanvasInput(canvasHandler)
        if (window.setSelectionSuppressed) window.setSelectionSuppressed(true)
        loadProgress()
        renderHeader()
      })
    }

    // Language first, before anything else can be painted. This script sits at
    // the end of <body>, so every [data-i18n] node already exists, and running
    // here — rather than waiting for DOMContentLoaded, let alone for the host
    // to inject `window.locale` — is what keeps the markup's own language from
    // showing through on a host speaking the other one. Reads `?lang=` (see
    // urlLocale); with no parameter it is a no-op that re-applies the default.
    applyLocale()

    window.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
