<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title">扫雷</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f5f5f7; color: #111827; font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,0.06);
    }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .gauge { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .gauge small { font-size: 11px; font-weight: 500; color: #6b7280; margin-right: 3px; }
    .face { font-size: 26px; margin-left: auto; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 16px; font-size: 14px; border-radius: 999px;
      border: 1px solid #d1d5db; background: #f9fafb; color: #111827; cursor: pointer;
    }
    .btn:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    select { padding: 6px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; }
    label.field { display: inline-flex; align-items: center; gap: 6px; color: #4b5563; }
    .best { color: #6b7280; font-size: 12px; margin-top: 8px; }
    .hint { color: #6b7280; font-size: 11px; line-height: 1.6; }
    .msg { font-weight: 700; font-size: 14px; min-height: 18px; margin-top: 6px; }
    .msg.win { color: #15803d; } .msg.lose { color: #b91c1c; }
  </style>
</head>
<body>
  <h1 data-i18n="title">扫雷</h1>
  <div class="subtitle" data-i18n="subtitle">Minesweeper — 左键翻开，右键插旗，找出所有非雷格</div>

  <div class="card">
    <div class="row">
      <span class="gauge"><small>💣</small><span id="mines">0</span></span>
      <span class="gauge"><small>⏱</small><span id="time">0</span>s</span>
      <span id="face" class="face">🙂</span>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div class="card">
    <div class="row">
      <label class="field"><span data-i18n="difficulty">难度</span>
        <select id="difficulty">
          <option value="easy" data-i18n="easy">初级 9×9 · 10</option>
          <option value="medium" data-i18n="medium">中级 16×16 · 40</option>
          <option value="hard" data-i18n="hard">高级 16×30 · 99</option>
        </select>
      </label>
      <button id="new-btn" class="btn btn-primary" type="button" data-i18n="newGame">新游戏</button>
    </div>
    <div id="best" class="best"></div>
  </div>

  <div class="card">
    <div class="hint" data-i18n-html="hint">
      在右侧「扫雷」表上：<b>左键</b>翻开格子，<b>右键</b>插旗/取消旗。<br/>
      数字表示周围 8 格里的地雷数；翻到空白会自动展开一片。<br/>
      首次点击一定安全。把所有非雷格翻开即获胜；踩到 💣 就结束。
    </div>
  </div>

  <script src="./minesweeper.js"></script>
  <script>
    var MS = window.Minesweeper

    // ---- language ----------------------------------------------------
    //
    // The host tells a craft which language it is speaking (`window.locale`,
    // a BCP-47 tag) and offers to say so again when the user switches
    // (`window.onLocaleChange`). Both are optional: opened standalone, or in
    // an older host, neither exists and the craft stays in its default
    // language — which is why `pickLocale` falls back rather than throwing.
    //
    // The board's SHEET NAME follows the language too (the tab is something
    // the player reads). It is also how the craft finds its board again, so
    // lookups go through the module's findBoardSheet, which knows every name
    // we ship — a game started in Chinese is still found after a switch to
    // English, and the sheet is renamed rather than duplicated.
    var STRINGS = {
      'zh-CN': {
        title: '扫雷',
        subtitle: 'Minesweeper — 左键翻开，右键插旗，找出所有非雷格',
        difficulty: '难度',
        easy: '初级 9×9 · 10',
        medium: '中级 16×16 · 40',
        hard: '高级 16×30 · 99',
        newGame: '新游戏',
        hint: '在右侧「扫雷」表上：<b>左键</b>翻开格子，<b>右键</b>插旗/取消旗。<br/>数字表示周围 8 格里的地雷数；翻到空白会自动展开一片。<br/>首次点击一定安全。把所有非雷格翻开即获胜；踩到 💣 就结束。',
        best: '最佳：初级 {{easy}} · 中级 {{medium}} · 高级 {{hard}}',
        lose: '💥 踩到雷了！点「新游戏」再来',
        win: '🎉 全部扫清！用时 {{seconds}}s',
        newRecord: '（新纪录！）',
        notReady: '工作簿尚未就绪',
        genFailed: '生成失败：'
      },
      en: {
        title: 'Minesweeper',
        subtitle: 'Minesweeper — left-click to uncover, right-click to flag, find every square that is not a mine',
        difficulty: 'Difficulty',
        easy: 'Beginner 9×9 · 10',
        medium: 'Intermediate 16×16 · 40',
        hard: 'Expert 16×30 · 99',
        newGame: 'New game',
        hint: 'On the board sheet: <b>left-click</b> uncovers a square, <b>right-click</b> flags it.<br/>A number is how many mines touch that square; uncovering a blank opens the whole region around it.<br/>The first click is always safe. Uncover every non-mine square to win; hit a 💣 and it is over.',
        best: 'Best: beginner {{easy}} · intermediate {{medium}} · expert {{hard}}',
        lose: '💥 You hit a mine! Press “New game” to try again',
        win: '🎉 All clear in {{seconds}}s',
        newRecord: ' (new record!)',
        notReady: 'The workbook is not ready yet',
        genFailed: 'Could not deal a board: '
      }
    }

    // NOT `locale`: a top-level `var locale` IS `window.locale`, the
    // property the host injects — same binding, so each would silently
    // overwrite the other.
    var craftLocale = 'zh-CN'

    /** Nearest language we actually have, for whatever the host reports. */
    function pickLocale(tag) {
      if (!tag) return 'zh-CN'
      if (STRINGS[tag]) return tag
      var base = String(tag).replace('_', '-').split('-')[0].toLowerCase()
      if (base === 'zh') return 'zh-CN'
      if (base === 'en') return 'en'
      return 'zh-CN'
    }

    /** A string, with `{{name}}` filled in from `vars`. */
    function T(key, vars) {
      var d = STRINGS[craftLocale] || STRINGS['zh-CN']
      var s = d[key] != null ? d[key] : key
      if (!vars) return s
      return s.replace(/\{\{(\w+)\}\}/g, function (_, k) {
        return vars[k] != null ? vars[k] : ''
      })
    }

    function applyLocale(tag) {
      craftLocale = pickLocale(tag)
      document.documentElement.lang = craftLocale
      var els = document.querySelectorAll('[data-i18n]')
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = T(els[i].getAttribute('data-i18n'))
      }
      var html = document.querySelectorAll('[data-i18n-html]')
      for (var j = 0; j < html.length; j++) {
        html[j].innerHTML = T(html[j].getAttribute('data-i18n-html'))
      }
      // The board's tab is part of the UI too, so a language switch renames
      // the sheet. Nothing to do before the host has injected a workbook, and
      // a failed rename just leaves the old name — never break the page over a
      // tab label.
      if (wb && MS) {
        MS.renameBoardToLocale(wb, craftLocale).catch(function () {})
      }
      if (typeof onLocaleApplied === 'function') onLocaleApplied()
    }
    var wb = null
    var boardSheetIdx = null
    var game = null
    var progress = null
    var busy = false
    var timerId = null, startMs = 0

    function notify(level, msg) {
      try { if (window.notifyCraft) window.notifyCraft(level, msg) } catch (e) {}
      if (level === 'error') console.error('[minesweeper]', msg)
    }

    function elapsedSec() { return startMs ? Math.floor((Date.now() - startMs) / 1000) : 0 }
    function updateTime() { document.getElementById('time').textContent = elapsedSec() }
    function startTimer() { if (timerId) return; startMs = Date.now(); timerId = setInterval(updateTime, 250) }
    function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null } }

    function updateGauges() {
      document.getElementById('mines').textContent = game ? (game.mines - MS.flagsUsed(game)) : 0
      var face = '🙂'
      if (game && game.over) face = '😵'
      else if (game && game.won) face = '😎'
      document.getElementById('face').textContent = face
    }
    function renderBest() {
      var b = progress.best, fmt = function (v) { return v == null ? '—' : v + 's' }
      document.getElementById('best').textContent =
        T('best', {easy: fmt(b.easy), medium: fmt(b.medium), hard: fmt(b.hard)})
    }
    function setMsg(t, cls) {
      var el = document.getElementById('msg'); el.textContent = t || ''
      el.className = 'msg' + (cls ? ' ' + cls : '')
    }

    function loadProgress() { progress = MS.parseProgress(window.getCraftState ? window.getCraftState() : undefined) }
    function saveProgress() { if (window.setCraftState) window.setCraftState(MS.serializeProgress(progress)) }

    // ---- input ------------------------------------------------------
    function canvasHandler(e) {
      if (boardSheetIdx === null || e.sheetIdx !== boardSheetIdx) return false
      if (e.type === 'contextmenu') return true // suppress native menu on board
      var onBoard = game && e.row != null && e.col != null &&
        e.row >= 0 && e.row < game.rows && e.col >= 0 && e.col < game.cols
      if (e.type === 'mousedown') {
        if (onBoard && !game.over && !game.won) {
          if (e.button === 2) doFlag(e.row, e.col)
          else if (e.button === 0) doReveal(e.row, e.col)
        }
        return onBoard ? true : false
      }
      if (e.type === 'click' || e.type === 'dblclick' || e.type === 'mouseup')
        return onBoard ? true : false
      return false
    }

    async function doReveal(r, c) {
      if (busy) return
      busy = true
      try {
        var changed = MS.reveal(game, r, c)
        if (game.started) startTimer()
        if (changed.length) await MS.renderCells(wb, boardSheetIdx, game, changed)
        updateGauges()
        if (game.over) { stopTimer(); setMsg(T('lose'), 'lose') }
        else if (game.won) { stopTimer(); onWin() }
      } catch (e) { notify('error', e) } finally { busy = false }
    }

    async function doFlag(r, c) {
      if (busy) return
      busy = true
      try {
        var i = MS.toggleFlag(game, r, c)
        if (i >= 0) await MS.renderCells(wb, boardSheetIdx, game, [i])
        updateGauges()
      } catch (e) { notify('error', e) } finally { busy = false }
    }

    function onWin() {
      var t = elapsedSec(); updateTime()
      var d = progress.difficulty
      var prev = progress.best[d]
      var record = prev == null || t < prev
      if (record) { progress.best[d] = t; saveProgress(); renderBest() }
      updateGauges()
      setMsg(T('win', {seconds: t}) + (record ? T('newRecord') : ''), 'win')
    }

    // ---- new game ---------------------------------------------------
    async function newGame(diff) {
      if (busy || !wb) { if (!wb) notify('error', T('notReady')); return }
      busy = true
      try {
        stopTimer(); startMs = 0; updateTime()
        progress.difficulty = diff
        saveProgress()
        game = MS.newGame(MS.DIFFICULTY[diff])
        boardSheetIdx = await MS.setupBoard(wb, game, craftLocale)
        if (window.setSelection) window.setSelection(boardSheetIdx, 0, 0)
        setMsg('')
        updateGauges(); renderBest()
      } catch (e) {
        notify('error', T('genFailed') + (e && e.message || e))
      } finally { busy = false }
    }

    // ---- boot -------------------------------------------------------
    function whenHostReady(cb) {
      var tries = 0
      ;(function loop() {
        if (typeof window.onCanvasInput === 'function' && window.workbook) { cb(); return }
        if (tries++ > 600) { console.warn('[minesweeper] host APIs not injected'); return }
        setTimeout(loop, 50)
      })()
    }

    // Re-render the strings this craft builds in JS whenever the language
    // changes; `applyLocale` calls this after swapping the static markup.
    function onLocaleApplied() {
      if (progress) renderBest()
    }

    function init() {
      MS = window.Minesweeper
      // The page's own language, for the moment before the host has injected
      // anything (and forever, when opened standalone).
      applyLocale(window.locale)
      document.getElementById('difficulty').addEventListener('change', function (e) { newGame(e.target.value) })
      document.getElementById('new-btn').addEventListener('click', function () {
        newGame(document.getElementById('difficulty').value)
      })
      whenHostReady(function () {
        wb = window.workbook
        // Now that the host has injected, take its language and keep
        // following it. This has to be here, not in `init`: the iframe's
        // DOMContentLoaded fires before the parent's injection, so at init
        // time `window.locale` is still undefined.
        applyLocale(window.locale)
        if (typeof window.onLocaleChange === 'function') {
          window.onLocaleChange(applyLocale)
        }
        window.onCanvasInput(canvasHandler)
        if (window.setSelectionSuppressed) window.setSelectionSuppressed(true)
        loadProgress()
        document.getElementById('difficulty').value = progress.difficulty
        renderBest()
        newGame(progress.difficulty)
      })
    }
    window.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
