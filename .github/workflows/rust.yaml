name: rust test

on: [pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose --workspace --locked
      - name: Run tests
        run: cargo test --verbose --workspace --locked

      - name: generate bindings and ensure clean
        run: cargo run --package buildtools --bin generate --all-features
      - uses: numtide/clean-git-action@v1

      - name: Test using Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install and build (JS / WASM)
        run: ./scripts/ci-build.sh

      - name: Test logisheets-web and logisheets-core
        run: |
          yarn workspace logisheets-web test
          yarn workspace logisheets-core test

      # The root app's own suite (src/, crafts/): locales, and the formula
      # function list kept in step with the engine's dispatch. Needs the
      # merged resources/funcs/out/funcs.json, which ci-build.sh generates.
      - name: Test the app
        run: yarn test

      - name: Test logisheets-engine
        run: yarn workspace logisheets-engine test

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium webkit
      - name: Run engine UI e2e tests
        run: yarn test:e2e

      - name: Test logisheets-node
        run: yarn workspace logisheets test

      - name: Test logisheets-runtime
        run: yarn workspace logisheets-runtime test

      - name: Test logisheets-logician
        run: yarn workspace logisheets-logician test

      # Packs the published tarballs and imports them from plain Node, so it
      # needs every dist above it. Runs alone: it is subprocess-bound and the
      # other suites saturate the runner.
      - name: Test npm packaging (published tarballs)
        run: yarn workspace logisheets test:packaging
