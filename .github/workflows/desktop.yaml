name: desktop build

# Builds the Tauri desktop app and uploads the installers as workflow
# artifacts; optionally attaches them to a GitHub Release of its own.
#
# Two ways in: manual dispatch (one-off builds), and `workflow_call` from
# release.yaml, which builds every distribution when a release is published.
# A release goes through THAT workflow, not this one's `release` input.
#
# Windows is the only platform built by default — macOS needs Apple Developer
# signing and notarization to produce something a user can actually open, and
# that is not set up yet. Flip `platforms` to build it anyway for testing.
#
# `distribution` selects which crafts the app ships, its default UI language,
# and its product name / bundle id / window title — see crafts.config.json
# ("default" = full app, "en"/"zh" = the release builds, "games" = mini-games).
#
# SIGNING (Windows): unsigned unless the repository has both
# `WINDOWS_CERTIFICATE` (base64 of a .pfx) and `WINDOWS_CERTIFICATE_PASSWORD`.
# Without them the build still succeeds and SmartScreen will warn users on
# first run. The workflow says which one you got, in the summary.
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Craft distribution to package (a key in crafts.config.json)"
        default: "en"
        type: string
      platforms:
        description: "Which platforms to build"
        default: "windows"
        type: choice
        options:
          - windows
          - windows+macos
      release:
        description: "Publish a GitHub Release with the installers"
        default: false
        type: boolean
      tag:
        description: "Release tag (required when publishing, e.g. v1.14.1)"
        default: ""
        type: string
  # Callable from release.yaml, which builds every distribution on a tag and
  # publishes them together. Artifacts uploaded here are visible to the
  # caller's later jobs — same workflow run.
  workflow_call:
    inputs:
      distribution:
        default: "en"
        type: string
      platforms:
        default: "windows"
        type: string
      release:
        default: false
        type: boolean
      tag:
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  CRAFT_DIST: ${{ inputs.distribution }}

jobs:
  # ---------------------------------------------------------------------------
  # 0. Refuse a half-specified release before spending 20 minutes on a build.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.release }}" = "true" ] && [ -z "${{ inputs.tag }}" ]; then
            echo '::error::release needs a tag (e.g. desktop-v0.1.0).'
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 1. Build the web frontend ONCE on Linux.
  #
  # The Tauri app is a thin shell that loads this web bundle (tauri.conf.json
  # `frontendDist: ../../../dist`, `beforeBuildCommand` empty). The bundle is
  # OS-independent, and the repo's build scripts are POSIX `.sh` — so we build
  # `dist/` here where they run cleanly, then hand it to the per-OS bundlers.
  # This also keeps wasm-pack / yarn off the macOS and Windows runners.
  # ---------------------------------------------------------------------------
  frontend:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust (for the WASM engine)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Runs the exact same install + build sequence as PR CI, ending in
      # `yarn build`, which produces the repo-root `dist/` that Tauri bundles.
      - name: Build web frontend (JS + WASM)
        run: ./scripts/ci-build.sh

      - name: Report what was built
        run: node scripts/craft-dist.mjs info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2. Bundle the desktop app per OS using the prebuilt frontend.
  #
  # No JS toolchain needed for the bundle itself: we download `dist/` and run
  # `cargo tauri build`, which bundles it (beforeBuildCommand is empty).
  # src-tauri is a standalone crate excluded from the cargo workspace, so it
  # builds in place.
  # ---------------------------------------------------------------------------
  bundle:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        # A one-entry matrix by default; `windows+macos` adds the mac runner.
        # Expressed as a JSON literal because `workflow_dispatch` inputs cannot
        # drive `matrix` any other way.
        include: ${{ inputs.platforms == 'windows+macos'
          && fromJSON('[{"os":"windows-latest","artifact":"windows"},{"os":"macos-latest","artifact":"macos"}]')
          || fromJSON('[{"os":"windows-latest","artifact":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      # A step's `if` cannot read `secrets`; it can read job `env`. This is the
      # documented way to ask "was a certificate configured?".
      HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri has its own Cargo.lock (standalone crate).
          workspaces: packages/desktop/src-tauri

      # The tauri CLI, from npm — it ships a prebuilt native binary (no
      # compile) and is a CI-only global install, so it never enters the
      # repo's dependency graph (see packages/desktop/README.md).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Put the signing certificate in the runner's store and hand its
      # thumbprint to the build through the environment. `craft-dist.mjs tauri`
      # adds the signing block only when that variable is set, so a repository
      # without the secrets produces an unsigned bundle instead of failing.
      - name: Import Windows signing certificate
        if: matrix.os == 'windows-latest' && env.HAVE_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          # The thumbprint is what tauri.conf's certificateThumbprint selects.
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Product name / bundle id / window title / locale for this distribution
      # (plus signing, when the step above set a thumbprint), merged over
      # src-tauri/tauri.conf.json. Passed as a raw JSON string (not a file
      # path) so there's no cross-platform path resolution to get wrong; the
      # command-substitution output is one argument even with quotes inside.
      # `shell: bash` so it's identical on the Windows runner.
      - name: Build desktop bundle
        shell: bash
        working-directory: packages/desktop
        run: |
          echo "signing: $(node ../../scripts/craft-dist.mjs signing)"
          tauri build -c "$(node ../../scripts/craft-dist.mjs tauri)"

      - name: Summarise
        shell: bash
        run: |
          {
            echo "### ${{ matrix.artifact }} (${{ inputs.distribution }})"
            echo "- signing: \`$(node scripts/craft-dist.mjs signing)\`"
            echo '```'
            find packages/desktop/src-tauri/target/release/bundle -type f \
              \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec basename {} \;
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: logisheets-desktop-${{ inputs.distribution }}-${{ matrix.artifact }}
          # Windows: bundle/nsis/*-setup.exe + bundle/msi/*.msi
          # macOS:   bundle/dmg/*.dmg + bundle/macos/*.app
          path: packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Publish, only when asked for. Draft, so the release notes are written by
  #    a person before anyone can download it.
  # ---------------------------------------------------------------------------
  publish:
    if: inputs.release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: logisheets-desktop-${{ inputs.distribution }}-*
          path: bundles

      # Only the installers — not the unpacked .app or the intermediate build
      # output that shares the artifact directory.
      - name: Collect installers
        run: |
          mkdir -p release
          find bundles -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} release/ \;
          ls -la release
          test -n "$(ls -A release)" || { echo "::error::no installers found"; exit 1; }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAVE_WINDOWS_CERT" = "true" ]; then
            SIGNING="Signed."
          else
            SIGNING="**Unsigned** — Windows SmartScreen will warn on first run."
          fi
          NOTES="Windows installers for the \`${{ inputs.distribution }}\` distribution. $SIGNING"
          gh release create "${{ inputs.tag }}" \
            --draft \
            --title "LogiSheets Desktop ${{ inputs.tag }}" \
            --notes "$NOTES" \
            release/*
