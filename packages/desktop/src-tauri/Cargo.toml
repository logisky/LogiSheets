# NOTE: excluded from the root cargo workspace (see root Cargo.toml `exclude`),
# because its `wry` dependency needs GUI system libs that headless Linux CI
# lacks. This is therefore a STANDALONE crate/workspace with explicit (not
# workspace-inherited) package fields and its own Cargo.lock.
[package]
name = "logisheets-desktop"
version = "1.16.1"
edition = "2021"
description = "LogiSheets desktop application (Tauri host)"
publish = false

# The library holds the app logic (so it can also target mobile later); the
# binary is a thin `main` that calls `run()`.
[lib]
name = "logisheets_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Used by the default craft-storage commands (src/storage.rs) to (de)serialize
# the app-data JSON, and by the optional native engine.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Native HTTP for the `llm_fetch` command (src/net.rs): lets the frontend reach
# LLM providers (Kimi/Moonshot, Anthropic, ...) from Rust instead of the webview
# fetch, sidestepping browser CORS. rustls avoids a system OpenSSL dependency so
# the desktop build stays portable across CI runners.
#
# `rustls-no-provider` + the explicit `rustls/ring` below, not plain `rustls`:
# since 0.13 that pulls in aws-lc-rs (a C/cmake build), and sqlx already brings
# ring. With both providers compiled in rustls cannot pick a default and the
# first HTTPS request panics, so there must be exactly one.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Package bytes cross IPC as base64 (src/crafts.rs).
base64 = "0.23"
# Data connections (src/db.rs): SQL against Postgres / MySQL / SQLite for the
# `dataConnections` craft capability. rustls for the same portability reason as
# reqwest; bigdecimal so NUMERIC/DECIMAL round-trip exactly as strings.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "bigdecimal",
    "json",
    "uuid",
] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
# Connection passwords live in the OS keychain, never in the app-data file.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
logisheets-rs = { path = "../../../crates/api", features = ["rpc"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# OFF by default. The default desktop build is a lean shell that runs the
# existing web app (WASM engine) inside the Tauri window. Enable this to also
# compile the in-process native engine + `handle` command (for a future hybrid:
# native open/save of huge .xlsx, batch export) — see src/commands.rs.
default = []
native-engine = ["dep:logisheets-rs"]

# Standalone workspace (excluded from the repo root workspace) so it has its own
# Cargo.lock and doesn't pull GUI system-lib deps into the core `--workspace` build.
[workspace]
