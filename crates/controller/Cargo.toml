[package]
name = "logisheets_controller"
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core spreadsheet engine for LogiSheets: formula evaluation, dependency tracking, and undo/redo."
edition.workspace = true
repository = "https://github.com/logisky/LogiSheets"
keywords = ["excel", "spreadsheet", "xlsx", "formula", "ooxml"]

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }
futures = "0.3.34"
colorsys = "0.7.3"
imbl = { workspace = true }
itertools = "0.15.0"
lazy_static = { workspace = true }
num = "0.4.3"
num-bigint = "0.5"
num-traits = "0.2"
rand = "0.10.3"
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
statrs = "0.19.1"
unicode-segmentation = "1.13.3"
wildescape = { workspace = true }
uuid = { version = "1.29.0", features = ["v4", "fast-rng", "macro-diagnostics"] }

ssf-rs = { workspace = true }

logisheets_base = { workspace = true}
logisheets_lexer = { workspace = true}
logisheets_lexer4fmt = { workspace = true }
logisheets_parser = { workspace = true}
logisheets_workbook = { workspace = true }
logisheets_astchecker = { workspace = true }

gents = { workspace = true }
gents_derives = { workspace = true }
# For `XmlValue::serialize` on the OOXML simple-type enums, used to report an
# icon-set name to the frontend without duplicating the spec's string table.
xmlserde = { workspace = true }

[features]
sequencer = []
default = []
