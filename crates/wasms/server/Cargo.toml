[package]
authors.workspace = true
edition.workspace = true
name = "logisheets_wasm_server"
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
js-sys = "0.3.107"
singlyton = "4.1.1"
wasm-bindgen = { version = "0.2.130", features = ["serde-serialize"] }
web-sys = { version = "0.3.107", features = ["console"] }
# Pick the browser's `crypto.getRandomValues` as the randomness source for the
# crates `logisheets_controller` uses (`rand` via getrandom, and `uuid`), which
# otherwise refuse to build for wasm32-unknown-unknown.
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

logisheets-rs = { workspace = true, features = ["rpc"] }
ssf-rs = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
