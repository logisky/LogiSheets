[package]
name = "xmldiff"
# Independently versioned — NOT bumped by `just release` (see justfile
# rust_exclude). Bump this by hand only when xmldiff itself changes.
version = "1.9.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "compare 2 .xml files and show their differences"
repository = "https://github.com/logisky/LogiSheets/crates/xmldiff"

[dependencies]
quick-xml = { workspace = true, features = ["serialize"] }
