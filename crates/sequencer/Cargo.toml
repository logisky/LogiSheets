[package]
name = "logisheets_sequencer"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Collaborative editing server for LogiSheets — real-time multi-user spreadsheet sessions."
license.workspace = true

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
ezsockets = { version = "0.7.2" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54" }

logisheets_controller = { workspace = true, features = ["sequencer"] }

gents = { workspace = true }
gents_derives = { workspace = true }
